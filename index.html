<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2D0000">
  <title>Resto-Gestion — Admin</title>
  <link rel="stylesheet" href="shared/styles.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-title" id="header-title">Resto-Gestion</div>
      <div class="header-actions">
        <a href="kitchen.html" class="month-btn" title="Cuisine">👨‍🍳</a>
        <button type="button" class="month-btn" id="logout-btn" style="display:none;background:var(--danger);color:#fff;border:none;">🚪</button>
      </div>
    </header>
    <div class="subtabs" id="subtabs"></div>
    <main id="main"></main>
    <div id="toast"></div>
    <nav class="bottom-nav" id="bottom-nav" style="display:none;">
      <button type="button" class="nav-item active" data-action="set-tab" data-tab="menu">
        <span class="nav-indicator"></span>
        <span class="nav-icon">🍽️</span>
        <span class="nav-label">Menu</span>
      </button>
      <button type="button" class="nav-item" data-action="set-tab" data-tab="commandes">
        <span class="nav-indicator"></span>
        <span class="nav-icon">📋</span>
        <span class="nav-label">Commandes</span>
      </button>
    </nav>
  </div>

  <div id="auth-overlay" style="display:none;">
    <div class="auth-box stack">
      <h1>Administration</h1>
      <p class="small-label">Gestion du restaurant</p>
      <form class="form-col" id="auth-form" style="margin-top:16px">
        <input class="field" type="email" id="auth-email" placeholder="Email" required autocomplete="email">
        <input class="field" type="password" id="auth-password" placeholder="Mot de passe" required autocomplete="current-password">
        <button type="submit" class="btn-primary">Se connecter</button>
      </form>
      <div id="auth-msg" class="small-label danger" style="margin-top:10px;"></div>
      <div class="hub-links" style="margin-top:24px">
        <a href="kitchen.html">→ Interface Cuisine</a>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
